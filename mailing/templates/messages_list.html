{% extends 'base.html' %}
{% block title %}Сообщения{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Сообщения</h1>
    <a class="btn btn-primary" href="{% url 'message_add' %}">Добавить сообщение</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Тема письма</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for message in messages %}
            <tr>
                <td>{{ message.subject }}</td>
                <td>
                    <a href="{% url 'message_edit' message.pk %}" class="btn btn-sm btn-outline-secondary">Редактировать</a>
                    <a href="{% url 'message_delete' message.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
                </td>
            </tr>
        {% empty %}
            <tr><td colspan="2" class="text-center">Сообщений нет</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
