{% extends 'base.html' %}
{% block title %}Главная{% endblock %}
{% block content %}
<h1>Статистика рассылок</h1>
<div class="row">
    <div class="col-md-4">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body">
                <h5 class="card-title">Всего рассылок</h5>
                <p class="card-text display-4">{{ total_mailings }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-warning mb-3">
            <div class="card-body">
                <h5 class="card-title">Активных рассылок</h5>
                <p class="card-text display-4">{{ active_mailings }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">Уникальных получателей</h5>
                <p class="card-text display-4">{{ unique_clients }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
